[metadata]
name = klea_agent
version = 0.0.1
author = Ankur Sinha
author_email = ankursinha@fedoraproject.org
url = https://github.com/NeuroML/klea
project_urls =
    Documentation = https://neuroklea.org
    Source = https://github.com/NeuroML/klea
license = MIT
description = Knowledge vaLidated Expert AI Assistant for scientific research
long_description = file: Readme.md
long_description_content_type = text/markdown
classifiers=
    Intended Audience :: Science/Research
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering

[options]
install_requires =
    # [mcp] provides the shared bundled tool implementations
    # (klea_utils/mcp/tool_impls) plus httpx[http2] and beautifulsoup4.
    klea_utils[mcp]
    langchain
    langchain-core
    langchain-mcp-adapters
    # typer must be <0.27 for Python 3.12: docling 2.x (via docling-slim[standard])
    # requires typer<0.27.0, and newer typer otherwise forces docling back to 1.x
    typer>=0.12,<0.27
    yaspin

include_package_data = True
packages = find:

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    klea                     = klea_agent.ui.cli:agent_app
    klea-serve               = klea_agent.api.server:serve_app

[options.package_data]
klea_agent =
    *.md

[options.extras_require]
ollama =
    klea_utils[ollama]

huggingface =
    klea_utils[huggingface]

nicegui =
    klea_utils[nicegui]

full =
    klea_agent
    klea_agent[ollama]
    klea_agent[huggingface]
    klea_agent[nicegui]

test =
    pytest
    pytest-asyncio
    langchain-ollama
    klea_agent[full]

dev =
    klea_agent[test]
    pre-commit
    isort
    ruff
    mypy


[flake8]
extend-ignore = E501, E502, F403, F405, W503, W504, E251
