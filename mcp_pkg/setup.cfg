[metadata]
name = neuroml_mcp
version = 0.0.1
author = Ankur Sinha
author_email = ankursinha@fedoraproject.org
url = https://github.com/NeuroML/klea
project_urls =
    Documentation = https://klea.science
    Source = https://github.com/NeuroML/klea
license = GPL-3.0-or-later
description = MCP server for NeuroML tooling
long_description = file: Readme.md
long_description_content_type = text/markdown
classifiers=
    Intended Audience :: Science/Research
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering

[options]
install_requires =
    fastmcp>=3.0.0,<4
    fastmcp-docs
    httpx[http2]
    starlette
    pyneuroml[all]
    libneuroml
    # typer must be <0.27 for Python 3.12: docling 2.x (via docling-slim[standard])
    # requires typer<0.27.0, and newer typer otherwise forces docling back to 1.x
    typer>=0.12,<0.27

include_package_data = True
packages = find:

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    nml-mcp                = neuroml_mcp.server.main:mcp_app

[options.package_data]

[options.extras_require]
test =
    pytest
    pytest-asyncio

dev =
    neuroml_mcp[test]
    pre-commit
    isort
    ruff
    mypy


[flake8]
extend-ignore = E501, E502, F403, F405, W503, W504, E251
