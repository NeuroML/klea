name: Continuous builds

on:
  push:
    branches:
      - main
      - development
      - experimental
      - 'test*'
      - 'feat*'
      - 'fix*'
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - development
      - experimental
      - 'test*'
      - 'feat*'
      - 'fix*'
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/docs.yml'

jobs:
  build:
    env:
      UV_SYSTEM_PYTHON: 1

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false

    steps:

    - uses: actions/checkout@v7
    - name: Set up Python  ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version:  ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Print refs
      run: |
        echo "github.ref is: ${{ github.ref }}"
        echo "github.base_ref is: ${{ github.base_ref }}"


    - name: Update machine
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get upgrade -y

    - name: Install package
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          # neuroml-mcp needs NEURON (via pyneuroml[all]), which has no Windows wheels
          uv pip install "./utils_pkg[dev]" "./rag_pkg[dev]" "./agent_pkg[dev]"
        else
          uv pip install -r ./requirements.txt
        fi

    - name: List packages so far
      run: |
        uv pip list
        env

    - name: Test commands
      run: |
        klea-rag --help
        klea-rag-serve --help
        klea --help
        klea-serve --help
        klea-stores-create  --help
        if [ "$RUNNER_OS" != "Windows" ]; then
          nml-mcp --help
        fi

    - name: Setup Ollama
      uses: ai-action/setup-ollama@v2

    - name: Pull default models
      run: |
        ollama pull qwen3:0.6b
        ollama pull bge-m3

    - name: Create cache dir
      run: |
        mkdir -p ~/.cache/nml_mcp/

    - name: Run unit tests
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          bash ./scripts/run_tests.sh utils_pkg rag_pkg agent_pkg
        else
          bash ./scripts/run_tests.sh
        fi

    - name: Lint with ruff
      run: |
        ruff check . --exit-zero
