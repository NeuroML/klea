[metadata]
name = klea_utils
version = 0.5.0
author = Ankur Sinha
author_email = ankursinha@fedoraproject.org
url = https://github.com/NeuroML/neuroklea
project_urls =
    Documentation = https://neuroklea.org
    Source = https://github.com/NeuroML/neuroklea
license = GPL-3.0-or-later
description = Shared utilities for Klea packages
long_description = file: Readme.md
long_description_content_type = text/markdown
classifiers=
    Intended Audience :: Science/Research
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering

[options]
install_requires =
    langchain
    langchain-core
    langchain-openai
    langgraph
    fastmcp
    httpx
    tenacity
    fastapi
    rank_bm25
    # typer must be <0.27 for Python 3.12: docling 2.x (via docling-slim[standard])
    # requires typer<0.27.0, and newer typer otherwise forces docling back to 1.x
    typer>=0.12,<0.27
    cachetools
    uvicorn
    coolname
    colorlog
    platformdirs
    langgraph-checkpoint-sqlite
    aiosqlite
    json-repair

include_package_data = True
packages = find:

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    klea-stores-create = klea_utils.ui.stores_create:app [ingest]
    klea-mcp = klea_utils.mcp.server.bundled:app [mcp]

[options.package_data]

[options.extras_require]
mcp =
    # Shared MCP tool implementations (klea_utils/mcp/tool_impls) and the
    # httpx-session lifespan (klea_utils/mcp/lifespan.py).
    # httpx[http2] enables HTTP/2 support for the shared session.
    httpx[http2]
    beautifulsoup4
    # firecrawl-anydoc converts office/PDF/EPUB/CSV documents to Markdown
    # for the read_file tool (imports as anydoc).
    firecrawl-anydoc

chroma =
    langchain-chroma
    chromadb

pgvector =
    langchain-postgres

qdrant =
    langchain-qdrant

huggingface =
    langchain-huggingface

rerank =
    sentence-transformers

ollama =
    langchain-ollama
    ollama

nicegui =
    nicegui
    # linkify-it-py detects URLs in plain text (markdown linkify helper in
    # klea_utils/ui/linkify.py).
    linkify-it-py


ingest =
    docling
    # biblio/pdf.py imports pypdfium2 directly for PDF Info-dict metadata.
    # It is already installed via docling-slim[standard], but declared here
    # explicitly because we import it directly.
    pypdfium2
    # typer must be <0.27 for Python 3.12: docling 2.x (via docling-slim[standard])
    # requires typer<0.27.0, and newer typer otherwise forces docling back to 1.x
    typer>=0.12,<0.27
    xxhash
    transformers

full =
    klea_utils[mcp]
    klea_utils[ingest]
    klea_utils[chroma]
    klea_utils[pgvector]
    klea_utils[qdrant]
    klea_utils[huggingface]
    klea_utils[ollama]
    klea_utils[nicegui]

test =
    klea_utils[full]
    pytest
    pytest-asyncio
    pytest-xdist

dev =
    klea_utils[test]
    pre-commit
    isort
    ruff
    mypy

[flake8]
extend-ignore = E501, E502, F403, F405, W503, W504, E251
