[metadata]
name = klea_rag
version = 0.5.0
author = Ankur Sinha
author_email = ankursinha@fedoraproject.org
url = https://github.com/NeuroML/neuroklea
project_urls =
    Documentation = https://neuroklea.org
    Source = https://github.com/NeuroML/neuroklea
license = GPL-3.0-or-later
description = Generic RAG implementation
long_description = file: Readme.md
long_description_content_type = text/markdown
classifiers=
    Intended Audience :: Science/Research
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering

[options]
install_requires =
    klea_utils
    langchain
    langchain-core
    # typer must be <0.27 for Python 3.12: docling 2.x (via docling-slim[standard])
    # requires typer<0.27.0, and newer typer otherwise forces docling back to 1.x
    typer>=0.12,<0.27
    yaspin
    fastmcp

include_package_data = True
packages = find:

[options.packages.find]
where = .

[options.package_data]

[options.entry_points]
console_scripts =
    klea-rag                = klea_rag.ui.cli:rag_app
    klea-rag-serve          = klea_rag.api.server:serve_app

[options.extras_require]
chroma =
    klea_utils[chroma]

pgvector =
    klea_utils[pgvector]

qdrant =
    klea_utils[qdrant]

ollama =
    klea_utils[ollama]

huggingface =
    klea_utils[huggingface]

nicegui =
    klea_utils[nicegui]

full =
    klea_rag
    klea_rag[chroma]
    klea_rag[pgvector]
    klea_rag[qdrant]
    klea_rag[ollama]
    klea_rag[huggingface]
    klea_rag[nicegui]

test =
    pytest
    pytest-asyncio
    langchain-ollama
    klea_rag[full]

dev =
    klea_rag[test]
    pre-commit
    ruff
    isort
    mypy


[flake8]
extend-ignore = E501, E502, F403, F405, W503, W504, E251
