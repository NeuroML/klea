[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "localonly", # needs a live Klea endpoint: skipped unless KLEA_EVAL_BASE_URL is set.
    "eval", # test that exercises the evaluation harness end to end.
]
asyncio_mode = "auto"
# Show test logger debug records in failure reports (passing tests show nothing).
log_level = "DEBUG"
